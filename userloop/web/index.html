<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UserLoop 控制台</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;--green:#3fb950;--cyan:#58a6ff;--amber:#d29922;--red:#f85149}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"PingFang SC",sans-serif;padding:24px}
  h1{font-size:18px;margin-bottom:4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .panel h2{font-size:13px;color:var(--dim);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .kpi b{display:block;font-size:22px}
  .kpi span{color:var(--dim);font-size:11px}
  .bar{display:flex;align-items:center;gap:8px;margin:6px 0}
  .bar .label{width:90px;color:var(--dim);font-size:12px}
  .bar .track{flex:1;background:#21262d;border-radius:4px;height:16px;overflow:hidden}
  .bar .fill{height:100%;background:var(--cyan)}
  .bar .n{width:40px;text-align:right;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--dim);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:6px 8px;border-bottom:1px solid #21262d;vertical-align:top}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;border:1px solid var(--line)}
  .s-running{color:var(--cyan)} .s-verifying{color:var(--amber)} .s-verified{color:var(--green)} .s-failed{color:var(--red)}
  .v-effective{color:var(--green)} .v-neutral{color:var(--dim)}
  .refresh{float:right;color:var(--dim);font-size:12px;cursor:pointer}
</style>
</head>
<body>
<h1>UserLoop <span class="tag">全域自动化用户运营</span><a class="refresh" href="canvas" style="text-decoration:none">▦ 画布编排</a><span class="refresh" onclick="load()">⟳ 刷新</span></h1>
<div class="sub">全用户旅程自动形成 Loop：事件 → 旅程 → 断点 → Loop → 动作 → 验证回流</div>

<div class="kpis" id="kpis"></div>

<div class="grid">
  <div class="panel"><h2>旅程漏斗</h2><div id="funnel"></div></div>
  <div class="panel"><h2>Loop 状态</h2><div id="loopstatus"></div></div>
  <div class="panel"><h2>模板效果（验证回流）</h2><table><thead><tr><th>模板</th><th>effective</th><th>neutral</th></tr></thead><tbody id="tstats"></tbody></table></div>
  <div class="panel"><h2>最近旅程迁移</h2><table><thead><tr><th>用户</th><th>迁移</th><th>原因</th><th>时间</th></tr></thead><tbody id="transitions"></tbody></table></div>
  <div class="panel"><h2>最近 Loop</h2><table><thead><tr><th>ID</th><th>模板</th><th>状态</th><th>动作</th></tr></thead><tbody id="loops"></tbody></table></div>
  <div class="panel"><h2>最近事件</h2><table><thead><tr><th>用户</th><th>事件</th><th>来源</th><th>时间</th></tr></thead><tbody id="events"></tbody></table></div>
</div>

<script>
const fmt = s => (s||'').replace('T',' ').slice(0,19);
async function j(url){ const r = await fetch(url); return r.json(); }

function bar(label, value, max, color){
  const pct = max>0 ? Math.round(value/max*100) : 0;
  return `<div class="bar"><div class="label">${label}</div><div class="track"><div class="fill" style="width:${pct}%;background:${color||'var(--cyan)'}"></div></div><div class="n">${value}</div></div>`;
}

async function load(){
  const [d, loops, events] = await Promise.all([
    j('/api/v1/dashboard'), j('/api/v1/loops?limit=20'), j('/api/v1/events?limit=12')
  ]);
  const c = d.counts||{};
  document.getElementById('kpis').innerHTML =
    `<div class="kpi"><b>${c.users??0}</b><span>用户</span></div>
     <div class="kpi"><b>${c.events??0}</b><span>事件</span></div>
     <div class="kpi"><b>${c.loops??0}</b><span>Loops</span></div>
     <div class="kpi"><b>${c.actions??0}</b><span>动作</span></div>
     <div class="kpi"><b>${c.feedback??0}</b><span>回流</span></div>`;

  const max = Math.max(1, ...(d.funnel||[]).map(f=>f.users));
  const colors = {visitor:'#8b949e',signup:'#58a6ff',activated:'#1f6feb',paying:'#3fb950',retained:'#26a641',advocate:'#d29922'};
  document.getElementById('funnel').innerHTML =
    (d.funnel||[]).map(f=>bar(f.stage,f.users,max,colors[f.stage])).join('');

  document.getElementById('loopstatus').innerHTML =
    Object.entries(d.loop_status||{}).map(([k,v])=>bar(k,v,Math.max(1,...Object.values(d.loop_status||{a:1})))).join('');

  document.getElementById('tstats').innerHTML = Object.entries(d.template_stats||{})
    .map(([tid,v])=>`<tr><td>${tid}</td><td class="v-effective">${v.effective??0}</td><td class="v-neutral">${v.neutral??0}</td></tr>`).join('') || '<tr><td colspan=3 style="color:var(--dim)">暂无回流数据</td></tr>';

  document.getElementById('transitions').innerHTML = (d.recent_transitions||[])
    .map(t=>`<tr><td class="tag">${t.user_id.slice(0,14)}</td><td>${t.from_stage} → <b>${t.to_stage}</b></td><td style="color:var(--dim)">${t.reason}</td><td style="color:var(--dim)">${fmt(t.created_at)}</td></tr>`).join('') || '<tr><td colspan=4 style="color:var(--dim)">暂无</td></tr>';

  document.getElementById('loops').innerHTML = (loops.loops||[])
    .map(l=>`<tr><td>${l.id.slice(0,16)}</td><td>${l.template_id}</td><td class="s-${l.status}">${l.status}</td><td style="color:var(--dim)">${(l.actions||[]).map(a=>a.type+'/'+a.status).join(' · ')}</td></tr>`).join('') || '<tr><td colspan=4 style="color:var(--dim)">暂无</td></tr>';

  document.getElementById('events').innerHTML = (events.events||[])
    .map(e=>`<tr><td>${e.distinct_id}</td><td class="tag">${e.event}</td><td style="color:var(--dim)">${e.source}</td><td style="color:var(--dim)">${fmt(e.created_at)}</td></tr>`).join('');

  setTimeout(load, 30000);
}
load();
</script>
</body>
</html>
