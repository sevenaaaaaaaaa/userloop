<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UserLoop 登录</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;--cyan:#58a6ff;--red:#f85149}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px;width:340px}
  h1{font-size:18px;margin-bottom:4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:20px}
  input{width:100%;background:#0d1117;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
  input:focus{outline:none;border-color:var(--cyan)}
  button{width:100%;background:#1f6feb;color:#fff;border:none;border-radius:8px;padding:10px;font-size:14px;cursor:pointer}
  button:hover{filter:brightness(1.15)}
  .err{color:var(--red);font-size:12px;min-height:16px;margin-bottom:8px}
</style>
</head>
<body>
<div class="card">
  <h1>UserLoop</h1>
  <div class="sub">全域自动化用户运营 —— 登录后进入控制台</div>
  <div class="err" id="err"></div>
  <form onsubmit="return doLogin(event)">
    <input id="u" placeholder="用户名" autocomplete="username" autofocus>
    <input id="p" type="password" placeholder="密码" autocomplete="current-password">
    <button type="submit">登 录</button>
  </form>
</div>
<script>
async function doLogin(e){
  e.preventDefault();
  const u = document.getElementById('u').value.trim(), p = document.getElementById('p').value;
  try {
    const r = await fetch('api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p})});
    if (r.ok) { location.reload(); return false; }
    const d = await r.json().catch(()=>({}));
    document.getElementById('err').textContent = d.error || '登录失败';
  } catch (err) { document.getElementById('err').textContent = '网络错误'; }
  return false;
}
</script>
</body>
</html>
