<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画布编排 | UserLoop 运营台</title>
<link rel="stylesheet" href="static/ui.css">
<script>try{var t=localStorage.getItem('ul_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
<header id="chrome">
  <div class="bar">
    <div class="bar-start">
      <button class="chip act" onclick="document.getElementById('sidebar').classList.toggle('open')" title="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="brand"><span class="dot"></span>UserLoop<span class="bn-sub">全域运营台</span></div>
    </div>
    <div class="bar-center">
      <span class="searchbox" style="cursor:default">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="9" width="6" height="6" rx="1.5"/><path d="M9 6h3a3 3 0 0 1 3 3"/><path d="M6 9v3a3 3 0 0 0 3 3h6"/></svg>
        trigger → condition → action → delay → exit
        <kbd>Canvas</kbd>
      </span>
    </div>
    <div class="bar-end">
      <button class="chip act" onclick="toggleTheme()" title="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg>
      </button>
      <span class="chip" id="me-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg><span id="me-name">—</span></span>
      <button class="chip act" onclick="logout()" title="退出登录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 12H4m0 0 4-4m-4 4 4 4"/><path d="M14 4h5v16h-5"/></svg>
      </button>
    </div>
  </div>
</header>

<div id="app">
  <nav id="sidebar">
    <div class="sb-grp">运营</div>
    <a class="nv" href="./"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>总览</a>
    <a class="nv" href="./#sec-journey"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h4V9H4zM10 19h4V4h-4zM16 19h4v-7h-4z"/></svg>旅程漏斗</a>
    <a class="nv" href="./#sec-loops"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2v6h-6"/><path d="M7 22v-6h6"/><path d="M20 8a8 8 0 0 0-13.7-4.7L4 6"/><path d="M4 16a8 8 0 0 0 13.7 4.7L20 18"/></svg>Loop 运行</a>
    <a class="nv" href="./#sec-users"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1.2-3.5 4-5 6.5-5s5.3 1.5 6.5 5"/><path d="M16 7.5a3 3 0 1 1 3 4.5"/></svg>用户档案</a>
    <a class="nv" href="./#sec-events"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 8-4-16-3 8H2"/></svg>事件流</a>
    <div class="sb-grp">编排</div>
    <a class="nv on" href="canvas"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="9" width="6" height="6" rx="1.5"/><path d="M9 6h3a3 3 0 0 1 3 3"/><path d="M6 9v3a3 3 0 0 0 3 3h6"/></svg>画布编排</a>
    <div class="sb-foot">nodes/edges 图执行<br>delay 节点由调度器到点恢复</div>
  </nav>

  <main>
    <div class="page-head">
      <h1>画布编排</h1>
      <div class="sub" id="flow-meta">选择流程查看 / 编辑 / 测试触发</div>
      <div class="sp"></div>
      <select class="inp" id="flowSel" onchange="loadFlow()" style="min-width:190px"></select>
      <button class="btn ghost sm" onclick="runTest()">▶ 测试触发</button>
      <button class="btn primary sm" onclick="save()">保存</button>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="p-head"><h3>画布预览</h3><span class="p-sub">BFS 自动分层布局</span></div>
        <div class="p-body"><div class="canvas-wrap" id="canvasWrap"></div></div>
      </div>
      <div class="panel">
        <div class="p-head"><h3>Flow JSON</h3><span class="p-sub">编辑后保存生效</span></div>
        <div class="p-body"><textarea class="code" id="flowJson" spellcheck="false"></textarea></div>
      </div>
    </div>

    <div class="panel">
      <div class="p-head"><h3>最近执行 Runs</h3><span class="p-sub">trace 逐步回放</span></div>
      <div class="p-body">
        <table><thead><tr><th>Run</th><th>状态</th><th>执行轨迹</th></tr></thead><tbody id="runs"></tbody></table>
      </div>
    </div>
  </main>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
function toggleTheme(){
  const root=document.documentElement, dark=root.getAttribute('data-theme')==='dark';
  if(dark){root.removeAttribute('data-theme');localStorage.setItem('ul_theme','light');}
  else{root.setAttribute('data-theme','dark');localStorage.setItem('ul_theme','dark');}
}
async function logout(){ await fetch('api/logout',{method:'POST'}); location.href='./'; }
async function j(url){ const r=await fetch(url); if(r.status===401){location.href='./';return {};} return r.json(); }
const FLOW='api/v1/canvas';

let flow = null;

function layout(f){
  const nodes=f.nodes||[], edges=f.edges||[];
  const ids=nodes.map(n=>n.id);
  const outgoing={}; edges.forEach(e=>(outgoing[e.from]=outgoing[e.from]||[]).push(e.to));
  const indeg={}; ids.forEach(i=>indeg[i]=0); edges.forEach(e=>indeg[e.to]=(indeg[e.to]||0)+1);
  let layer=ids.filter(i=>!indeg[i]); const level={}; let L=0;
  layer.forEach(i=>level[i]=L);
  while(layer.length && L<20){
    const next=[];
    layer.forEach(i=>(outgoing[i]||[]).forEach(t=>{ if(level[t]===undefined){level[t]=L+1;next.push(t);} }));
    layer=next; L++;
  }
  ids.forEach(i=>{ if(level[i]===undefined) level[i]=L; });
  const cols={}; ids.forEach(i=>{ (cols[level[i]]=cols[level[i]]||[]).push(i); });
  const X=70, YG=86, NW=158, NH=50; const pos={};
  Object.entries(cols).forEach(([lv,arr])=>arr.forEach((id,k)=>{ pos[id]={x:X+lv*196,y:34+k*YG}; }));
  return {nodes,edges,pos,NW,NH,cols};
}

function render(f){
  const {nodes,edges,pos,NW,NH,cols}=layout(f);
  const maxRows=Math.max(1,...Object.values(cols).map(a=>a.length));
  const W=90+Object.keys(cols).length*196+40, H=60+maxRows*86;
  let svg=`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--border-strong)"/></marker></defs>`;
  edges.forEach(e=>{
    const a=pos[e.from], b=pos[e.to]; if(!a||!b) return;
    const x1=a.x+NW,y1=a.y+NH/2,x2=b.x,y2=b.y+NH/2,midx=(x1+x2)/2;
    svg+=`<path class="edge" d="M${x1},${y1} C${midx},${y1} ${midx},${y2} ${x2},${y2}"/>`;
    if(e.label) svg+=`<text class="edge-label" x="${midx}" y="${(y1+y2)/2-5}" text-anchor="middle">${esc(e.label)}</text>`;
  });
  nodes.forEach(n=>{
    const p=pos[n.id]; if(!p) return;
    const label=n.event?n.event:(n.stage?'stage:'+n.stage:(n.action?n.action.type:n.type));
    const sub={trigger:'触发',condition:'条件',action:'动作',delay:'延迟',exit:'结束'}[n.type]||n.type;
    svg+=`<g class="node t-${esc(n.type)}" transform="translate(${p.x},${p.y})">
      <rect width="${NW}" height="${NH}"/>
      <text x="11" y="20">${esc(label)}</text>
      <text class="ntype" x="11" y="37">${esc(sub)} · ${esc(n.id)}</text></g>`;
  });
  svg+='</svg>';
  $('canvasWrap').innerHTML=svg;
}

function loadFlowObj(f){
  flow=f; $('flow-meta').textContent=f.description||f.name||'';
  $('flowJson').value=JSON.stringify(f,null,2);
  render(f); loadRuns(f.id);
}

async function init(){
  const me=await j('api/auth/me'); $('me-name').textContent=me.login||me.name||me.username||'—';
  const r=await j(FLOW); const flows=r.flows||[];
  $('flowSel').innerHTML=flows.map(f=>`<option value="${esc(f.id)}">${esc(f.name||f.id)}${f.enabled===false?'（停用）':''}</option>`).join('');
  if(flows.length) loadFlow();
}
async function loadFlow(){
  const id=$('flowSel').value; const r=await j(`${FLOW}/${id}`); if(r.flow) loadFlowObj(r.flow);
}
async function loadRuns(id){
  const r=await j(`${FLOW}/${id}`); const runs=r.runs||[];
  $('runs').innerHTML=runs.slice(0,8).map(run=>{
    const trace=typeof run.trace==='string'?JSON.parse(run.trace||'[]'):(run.trace||[]);
    return `<tr><td class="mono">${esc(run.id)}</td><td class="s-${esc(run.status)}">${esc(run.status)}</td>
      <td style="color:var(--muted);font-size:var(--fs-md)">${trace.map(t=>`<span class="tag mono">${esc(t.type)}·${esc(t.node)}</span> ${esc(t.note)}`).join(' → ')}</td></tr>`;
  }).join('')||'<tr><td colspan="3" style="color:var(--faint)">暂无执行记录（点「测试触发」试跑）</td></tr>';
}
async function save(){
  try{
    const f=JSON.parse($('flowJson').value);
    const res=await (await fetch(`${FLOW}/${f.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(f)})).json();
    if(res.ok){ toast('已保存并生效'); loadFlowObj(f); } else toast('保存失败');
  }catch(e){ toast('JSON 解析失败：'+e.message); }
}
async function runTest(){
  const id=$('flowSel').value;
  const res=await (await fetch(`${FLOW}/${id}/test`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({distinct_id:'canvas_test_'+Date.now(),event:'signup',props:{}})})).json();
  if(res.ok){ toast(`测试 Run 状态：${res.status}`); loadFlow(); } else toast('触发失败');
}
init();
</script>
</body>
</html>
