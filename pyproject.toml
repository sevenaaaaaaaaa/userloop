[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "userloop"
version = "0.1.0"
description = "UserLoop - 全域自动化用户运营工具：用户旅程自动形成运营 Loop"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pydantic>=2.9",
    "click>=8.1",
    "rich>=13.8",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff", "mypy"]

[project.scripts]
userloop = "userloop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["userloop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
