
    # ── UserLoop 反向代理（2026-09-16）→ FastAPI :8600 ──
    RedirectMatch permanent ^/userflow(/.*)?$ /userloop$1
    ProxyPreserveHost Off
    RequestHeader set X-Forwarded-Host "nownexts.com"
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /userloop/ http://127.0.0.1:8600/userloop/
    ProxyPassReverse /userloop/ http://127.0.0.1:8600/userloop/
    <Location "/userloop/">
        Require all granted
    </Location>
